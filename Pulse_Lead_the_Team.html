<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pulse: Lead the Team</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e0e0f;--card:#1b1b1e;--ink:#f6f3ef;--mut:#a9a39d;--line:#34343a;--red:#E30613;--hot:#ff4b57;--C:#ff4b57;--D:#d9d9d9;--I:#d4b27a;--up:#3ddc84;--dn:#ff5a63;--gold:#ffc83d;box-sizing:border-box}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,#3a0a0f 0,var(--bg) 55%) fixed;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0}
#app{max-width:480px;margin:auto;padding:12px 14px 30px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}.logo{height:32px;color:#fff}.logo svg{height:32px;width:auto}.top .sp{margin-left:auto;display:flex;gap:5px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}.chip.hot{border-color:var(--gold);color:var(--gold);animation:pulse .8s infinite alternate}
.ib{background:none;border:0;color:var(--ink);font-size:18px;cursor:pointer;min-width:34px;min-height:34px}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}.seg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px;text-align:center}.seg.cur{border-color:var(--hot)}.seg.done{border-color:var(--gold)}
.seg div{display:flex;gap:3px;justify-content:center;margin-bottom:2px}.seg i{width:100%;height:5px;border-radius:3px;background:var(--line)}.seg i.f{background:linear-gradient(90deg,var(--red),var(--gold))}.seg small{font-size:10px;color:var(--mut);font-weight:700}.seg.done small{color:var(--gold)}
.en{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}.en svg{flex:1;height:26px}.en b{font-size:16px}
.team{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 3px;text-align:center;font-size:11px;cursor:pointer;color:inherit;font-family:inherit;transition:transform .2s}.ch:hover{transform:translateY(-2px)}
.av{width:46px;height:46px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-size:24px;position:relative;border:3px solid var(--rc,#888);animation:bob 2.4s ease-in-out infinite}.av s{position:absolute;right:-8px;bottom:-5px;font-size:16px;text-decoration:none}.av em{position:absolute;left:-7px;top:-6px;font-style:normal;font-size:13px}
.m{display:flex;align-items:center;gap:3px;margin:2px 4px}.m span{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.m span i{display:block;height:100%;transition:width .8s}.m u{width:9px;font-size:9px;text-decoration:none;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hot)}
.card h2{font-size:23px;margin:4px 0 6px;line-height:1.2}.mut{color:var(--mut);font-size:14px}.ico{font-size:44px;line-height:1}
.boss{background:linear-gradient(90deg,var(--red),#7a0610);color:#fff;font-weight:800;text-align:center;border-radius:10px;padding:5px;margin-bottom:10px;letter-spacing:.08em;font-size:12px;text-transform:uppercase;animation:pulse .7s infinite alternate}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:2px 0 12px}.timer i{display:block;height:100%;width:100%;background:var(--gold)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:9px;font:inherit;cursor:pointer;min-height:50px;box-shadow:0 4px 0 #000;transition:transform .12s,border-color .12s}.opt:hover,.opt:focus-visible{border-color:var(--hot);transform:translateY(-2px)}.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn{display:block;width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;min-height:52px;margin-top:10px;text-align:center;text-decoration:none;box-shadow:0 4px 0 #7a0610}.btn:active{transform:translateY(3px);box-shadow:none}.btn.g{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 #000}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ins{border-left:4px solid var(--hot);padding:6px 12px;background:#121214;border-radius:0 10px 10px 0;margin:10px 0}
.rx{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;animation:pop .4s both}.rx b{font-size:20px}.rx q{color:var(--ink);quotes:none}
.row{display:grid;grid-template-columns:78px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-size:14px}.row input{width:100%;accent-color:var(--red)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
.big{font:800 40px Georgia,serif;color:var(--gold)}.center{text-align:center}.pill{display:inline-block;padding:3px 11px;border-radius:99px;background:#121214;border:1px solid var(--line);font-size:13px;margin:3px}.pill.off{opacity:.35}.pill.on{border-color:var(--gold);color:var(--gold)}.pill.g{border-color:var(--up);color:var(--up)}.pill.a{border-color:var(--gold);color:var(--gold)}.pill.r{border-color:var(--dn);color:var(--dn)}
.st{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;color:#111}
.inp{display:block;width:100%;margin:8px 0 10px;padding:13px;border-radius:12px;border:2px solid var(--line);background:#121214;color:var(--ink);font:inherit;font-size:18px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--red)}
.cdi{background:#121214;border-radius:12px;padding:10px 12px;margin:8px 0;text-align:left}.stars{font-size:34px;letter-spacing:4px;color:var(--gold)}.stars s{text-decoration:none;color:var(--line)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin:2px 0 6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.pop{animation:pop .4s both}.shake{animation:shake .4s}.combo{font:800 22px Georgia,serif;color:var(--gold);animation:pulse .5s infinite alternate}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes pulse{to{transform:scale(1.05)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4)}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}#fx span{position:absolute;left:50%;top:45%;font-size:26px;animation:fly 1.2s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

['🎯','Targets land','New quarter, new targets. The team is waiting to hear them.',[['Email the targets. Short and clear.','Information with no conversation. Nobody felt heard.',[['*',-.3,0,0]]],['Hold a huddle: explain the why and listen to concerns.','Listening and context build Connect and trust.',[['*',.4,.1,.2]]],['Ask each person to set their own stretch goal.','Autonomy lifts Develop, though some wanted more guidance.',[['*',0,.5,.1],['~1',-.1,0,0]]]]],
['🌟','The star wants applause','Rohan closed a big deal and hints he deserves recognition.',[['Praise him loudly in front of everyone.','Recognition for one can feel unfair to the rest.',[[1,0,0,.6],['~1',0,0,-.2]]],['Thank the whole team and name each person’s contribution.','Specific recognition for all builds Inspire.',[['*',.1,0,.4],[1,0,0,-.1]]],['“Money is tight. Keep going.”','A missed moment of recognition stings.',[[1,-.3,0,-.6]]]]],
['🧩','Karan is stuck','Karan has been silent on a task for three days.',[['Take the task over yourself.','Quick fix, but Karan learned nothing.',[[3,.2,-.3,0]]],['Pair him with Anita for a coaching session.','Coaching grows Develop for both, and Anita feels trusted.',[[3,.2,.5,0],[0,0,.3,.1]]],['“Figure it out. You’ll learn.”','Without guidance, “figure it out” feels like being left alone.',[[3,-.4,-.2,0]]]]],
['🌙','Late nights','A deadline is close and Meera’s team is working until 10pm.',[['Praise the hustle on the team chat.','Praising overwork tells people balance does not matter.',[[2,-.5,0,0],[1,0,0,.2]]],['Send people home and move the deadline.','Protecting balance shows care.',[['*',.4,0,.1],[1,0,0,-.1]]],['Stay late and order dinner for everyone.','Nice gesture, but it does not fix the workload.',[['*',.2,0,.2],[2,-.2,0,0]]]]],

function tmr(){clearInterval(TM);if(CALM||!G||G.st!='play'||G.ph!='choose')return;const t0=Date.now();TM=setInterval(()=>{const f=1-(Date.now()-t0)/(CFG.secs*1000),b=$('#tb');if(b&&b.style)b.style.width=Math.max(0,f*100)+'%';if(f<=0){clearInterval(TM);act('pick','-1')}},100)}
function bestS(){try{return localStorage.getItem('pulseBest3')||'–'}catch(e){return'–'}}
function apply(en,k){G.dl=G.ch.map(()=>[0,0,0]);en.forEach(([t,c,d,i])=>G.ch.forEach(x=>{const hit=t=='*'||t===x.i||(typeof t=='string'&&t[0]=='~'&&+t.slice(1)!==x.i);if(hit)[c,d,i].forEach((dv,j)=>{const o=x.v[j];x.v[j]=clamp(o+dv*k,1,5);G.dl[x.i][j]+=x.v[j]-o})}))}
function act(a,v){
 if(a=='begin'){const n=($('#nm')&&$('#nm').value||'').trim().slice(0,20);RAW=n||'Leader';NAME=esc(RAW);try{localStorage.setItem('pulseName',RAW);localStorage.removeItem('pulseSave')}catch(e){}G={st:'intro',s:0};draw();return}
 if(a=='resume'){try{G=JSON.parse(localStorage.getItem('pulseSave'));RAW=G.nm||'Leader';NAME=esc(RAW);draw();tmr()}catch(e){G={st:'title'};draw()}return}
 if(a=='inext'){if(G.s<4){G.s++;draw()}else start();return}
 if(a=='chapgo'){G.qs=snap();G.st='play';G.ph='choose';draw();return}
 if(a=='toend'){G.st='end';draw();return}
 if(a=='start'){start();return}
 if(a=='mute'){MUTE=!MUTE;draw();return}
 if(a=='token'){const c=G.ch[+v];if(G.st!='play'||G.ph!='choose'||!c||G.tokens<1||c.known)return;G.tokens--;c.known=true;G.hint=`${c.n} needs ${DN[c.k]} most, ${NAME}. Keep that in mind.`;c.v[c.k]=clamp(c.v[c.k]+.5,1,5);c.v=c.v.map(x=>clamp(x+.1,1,5));snd(880,.15);burst(['💬','✨'],8);draw();return}
 if(a=='pick'){clearInterval(TM);const idx=ORDER[G.m],s=SC[idx],i=+v,boss=G.m%3==2,k=boss?1.5:1;const pre=snap();G.pre=pre;G.cur=i<0?['','Time ran out, '+NAME+'. Indecision is a decision, and people noticed.',[['*',-.2,-.2,-.1]]]:s[3][i];apply(G.cur[2],k);
  const g=G.dl.reduce((s,r)=>s+r[0]+r[1]+r[2],0),good=g>=.9;G.combo=good?G.combo+1:0;G.maxc=Math.max(G.maxc,G.combo);G.gain=g>0?Math.round(g*20*(boss?2:1)*(1+.25*Math.max(0,G.combo-1))):0;G.pts+=G.gain;
  G.tok=G.combo>0&&G.combo%3==0;if(G.tok)G.tokens++;
  G.rx=G.ch.map(c=>{const d=G.dl[c.i],j=[0,1,2].sort((x,y)=>Math.abs(d[y])-Math.abs(d[x]))[0];return{c,j,m:Math.abs(d[j]),up:d[j]>0,t:Q[j][d[j]>0?1:0][(c.i+G.m)%3]}}).filter(r=>r.m>=.15).sort((x,y)=>y.m-x.m).slice(0,3);
  G.verdict=g>=.9?`Great call, ${NAME}!`:g>0?`Decent, ${NAME}.`:`Ouch, ${NAME}.`;const sd=[0,1,2].map(j=>G.dl.reduce((s,r)=>s+r[j],0)),dj=[0,1,2].sort((x,y)=>Math.abs(sd[y])-Math.abs(sd[x]))[0];sd.forEach((x,j)=>G.sd[j]+=x);G.log.push({m:G.m,id:idx,t:s[1],j:dj,g});
  G.lens=`CDI lens: this tested <b>${BEH[idx]}</b>, a ${DEF[dj][1]} <b>${DN[dj]}</b> move (${sd[dj]>=0?'▲':'▼'}). ${DN[dj]} asks: ${DEF[dj][2].toLowerCase()}`;G.hint='';G.ph='fb';g>=0?(up(),burst(['✨','⭐','🎉'],good?22:8)):(dn(),shake());try{navigator.vibrate&&navigator.vibrate(g>=0?20:[40,30,40])}catch(e){}draw();return}
 if(a=='rewind'){if(!G.pre||G.rw<1)return;const rw=G.rw-1,qs=G.qs;G=JSON.parse(G.pre);G.rw=rw;G.qs=qs;G.pre=null;G.ph='choose';snd(400,.2,'triangle');draw();return}
 if(a=='replay'){if(!G.qs)return;const r=G.replays+1,qs=G.qs;G=JSON.parse(qs);G.replays=r;G.qs=qs;G.st='play';G.ph='choose';burst(['↺'],6);draw();return}
 if(a=='next'){G.ch.forEach(c=>c.v=c.v.map(x=>clamp(x-.05,1,5)));G.m++;G.hist.push({e:en(),d:avgs()});G.ph='choose';G.dl=null;G.pre=null;if(G.m%3==0){G.st='rate';G.self=null}draw();return}
 if(a=='sl'){G.self=G.self||[4,4,4];G.self[+v.d]=+v.val;return}
 if(a=='reveal'){G.self=G.self||[4,4,4];const t=avgs(),g=[0,1,2].map(d=>G.self[d]-t[d]),gap=avg(g.map(Math.abs)),big=g.map((x,i)=>[x,i]).sort((x,y)=>Math.abs(y[0])-Math.abs(x[0]))[0],bonus=Math.max(0,25-Math.round(gap*12.5));G.pts+=bonus;G.gaps.push(gap);g.forEach((x,j)=>G.od[j]+=x);
  G.q={team:t,gap,bonus,msg:gap<.4?'Your self-view matches your team’s view. That is rare and valuable.':big[0]>0?`Blind spot: you rated yourself higher on ${DN[big[1]]} than your team did.`:`Hidden strength: your team rates your ${DN[big[1]]} higher than you do.`};G.st='reveal';gap<.4?(up(),burst(['🪞','✨'],16)):snd(300,.2,'triangle');draw();return}
 if(a=='outc'){const rows=[],qn=G.m/3-1,e=G.hist[G.m].e,gl=CHAP[qn].goal,stars=e>=gl[2]?3:e>=gl[1]?2:e>=gl[0]?1:0;
  G.ch.forEach(c=>{const s=stat(c),t=th(c);let msg,pt;if(t>=3.9){msg=`Breakthrough! ${c.n} ${MOM[c.k]}.`;pt=60;G.bt++;if(c.quiet){c.quiet=false;G.cb++}}else if(t>=3.2){msg=`${c.n} is steady and contributing well.`;pt=20;if(c.quiet){c.quiet=false;G.cb++;msg=`${c.n} is back in the game!`}}else if(t>=2.8){msg=`${c.n}’s energy is fading. A 1-on-1 could help.`;pt=0}else{msg=`${c.n} has gone quiet. Reconnect before it spreads.`;pt=-20;c.quiet=true}G.pts+=pt;rows.push({c,s,msg})});
  G.stars[qn]=stars;G.pts+=stars*40;G.tokens++;let rew='🎟 +1 token.';if(qn<3){G.rw++;rew+=qn==0?' ⏪ Rewind unlocked: undo one decision.':' ⏪ +1 Rewind.'}else rew+=' 🏆 Final chapter complete.';
  G.q.rows=rows;G.q.rew=rew;G.st='outc';up();snd(1047,.3,'sine',.06,.3);burst(stars?['⭐','🎉']:['💪'],stars*10+4);draw();return}
 if(a=='cont'){if(G.m>=12){fin();return}G.st='chap';draw();return}
 if(a=='share'){card();return}}
function fin(){const av=avgs(),score=Math.max(0,G.pts),mx=av.indexOf(Math.max(...av)),mn=av.indexOf(Math.min(...av)),lv=LEVELS.filter(l=>score>=l[0]).pop()[1];
 const a=Math.min(...av)>=3.8?ARCH.G:Math.max(...av)<2.8?ARCH.F:ARCH[''+mx+mn]||ARCH.F;const sc=av.map(v=>Math.round((v-1)*25));G.end={av,sc,score,idx:Math.round(avg(sc)),mx,a,low:mn,lv};G.st='recap';up();burst(['🎉','⭐','✨'],30);try{if(score>(+localStorage.getItem('pulseBest3')||0))localStorage.setItem('pulseBest3',score)}catch(e){}draw()}
function card(){const e=G.end,c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d'),ts=G.stars.reduce((a,b)=>a+b,0);
 x.fillStyle='#f6f5f4';x.fillRect(0,0,1080,1350);x.fillStyle='#E30613';x.fillRect(0,0,24,1350);
 const f2=()=>{x.fillStyle='#141414';x.font='bold 46px Georgia';x.fillText(RAW+'’s result',80,350);x.font='bold 40px Georgia';x.fillText('Pulse: Lead the Team',80,420);x.font='bold 84px Georgia';x.fillText(e.a[0],80,540);x.fillStyle='#5f5b57';x.font='34px Arial';wrap(x,e.a[1],80,610,920,46);
  [0,1,2].forEach((d,i)=>{const y=780+i*110;x.fillStyle='#141414';x.font='bold 34px Arial';x.fillText(DN[d],80,y);x.fillStyle='#e2dedb';x.fillRect(300,y-30,560,34);x.fillStyle=['#E30613','#4a4a4a','#b08d57'][d];x.fillRect(300,y-30,560*(e.av[d]-1)/4,34);x.fillStyle='#141414';x.fillText(e.av[d].toFixed(1),890,y)});
  x.font='bold 44px Arial';x.fillText(`CDI Index ${e.idx} · ${e.lv} · ${e.score} pts`,80,1170);x.fillStyle='#E30613';x.font='bold 36px Arial';x.fillText('What is your CDI Leadership Profile?',80,1250);x.fillStyle='#5f5b57';x.font='28px Arial';x.fillText(CFG.ctaUrl.replace(/^https?:\/\//,''),80,1300);
  c.toBlob(b=>{const f=new File([b],'pulse-result.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Pulse: Lead the Team'}).catch(()=>{});else{const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='pulse-result.png';l.click()}})};
 const im=new Image();im.onload=()=>{x.drawImage(im,80,70,376,206);f2()};im.onerror=f2;
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent($('#lg').innerHTML.replace(/currentColor/g,'#141414').replace('<svg ','<svg width="188" height="103"'))}
function wrap(x,t,px,py,w,lh){let l='';t.split(' ').forEach(wd=>{if(x.measureText(l+wd).width>w){x.fillText(l,px,py);py+=lh;l=''}l+=wd+' '});x.fillText(l,px,py)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName!='INPUT')act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a=='sl'){act('sl',{d:t.dataset.v,val:t.value});$('#sv'+t.dataset.v).textContent=t.value}if(t.id=='calm')CALM=t.checked});
try{const sn=localStorage.getItem('pulseName');if(sn){RAW=sn;NAME=esc(sn)}}catch(e){}
G={st:'title'};draw();
